! Configuration statique
interface ethB
 ip address 10.X.B.A/24
!
interface ethC
 ip address 10.X.C.A/24
!
interface ethA
 ip address 172.X.A.254/24
!
! Configuration OSPF
router ospf
 network 10.X.B.0/24 area 0
 network 10.X.C.0/24 area 0
 network 172.X.A.0/24 area 0
!
 passive-interface ethA

log file /var/log/frr/frr.log